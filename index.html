            {

                name: 'IoT Platform',
                icon: '📡',

                scores: { scale: 5, readWrite: 2, consistency: 2, latency: 3, dataVolume: 5, failureTolerance: 4, geoDistribution: 4, costPressure: 3, changeVelocity: 3 },
                patterns: [
                    {

                    },
                    {

                            { name: 'InfluxDB', url: 'https://www.influxdata.com/', rationale: 'Write-optimized time-series database' },

                    },
                    {

                        text: 'Eventual consistency acceptable - sensor readings can be out of order.',
                        tools: [
                            { name: 'Cassandra', url: 'https://cassandra.apache.org/', rationale: 'AP database for sensor data' },

                        tools: [

                        ]
                    },
                    {
                        dimension: 'geoDistribution',
                        text: 'Regional hubs for device connectivity with centralized data warehouse.',
                        tools: [
                            { name: 'Regional MQTT Brokers', url: 'https://mosquitto.org/', rationale: 'Low-latency device connections' },

                    },
                    {
                        dimension: 'costPressure',
                        text: 'High data volume requires cost optimization with sampling and compression.',
                        tools: [
                            { name: 'Downsampling', url: 'https://www.influxdata.com/', rationale: 'Store 1-second data for 1 week, 1-hour for years' },
                            { name: 'Compression', url: 'https://www.timescale.com/', rationale: 'Reduce storage costs for time-series' }
                        ]

                    {

                        tools: [
                            { name: 'OTA Updates', url: 'https://aws.amazon.com/iot-device-management/', rationale: 'Deploy firmware remotely' },
                            { name: 'Protocol Versioning', url: 'https://mqtt.org/', rationale: 'Backward-compatible MQTT versions' }
                        ]
                    }
                ]
            }
        ];

        // ========== HOOKS ==========

        const useWindowSize = () => {
            const [size, setSize] = useState({ width: typeof window !== 'undefined' ? window.innerWidth : 1024 });

            useEffect(() => {
                const handleResize = () => setSize({ width: window.innerWidth });
                window.addEventListener('resize', handleResize);
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            return size;
        };

        // ========== RADAR CHART COMPONENT ==========

        const RadarChart = ({ selectedSystems, theme, width }) => {
            const isMobile = width < BREAKPOINTS.sm;
            const size = isMobile ? 380 : Math.min(700, width * 0.9);
            const padding = isMobile ? 60 : 100;
            const radius = (size - padding * 2) / 2;
            const center = size / 2;

            // Calculate points for radar chart
            const angleStep = (Math.PI * 2) / DIMENSIONS.length;
            const scale = d3.scaleLinear().domain([0, 5]).range([0, radius]);

            const getPoint = (dimensionIndex, value) => {
                const angle = angleStep * dimensionIndex - Math.PI / 2;
                const r = scale(value);
                return {
                    x: center + r * Math.cos(angle),
                    y: center + r * Math.sin(angle)
                };
            };

            // Grid levels
            const gridLevels = [1, 2, 3, 4, 5];

            const getPolygonPoints = (level) => {
                return DIMENSIONS.map((_, i) => {
                    const point = getPoint(i, level);
                    return `${point.x},${point.y}`;
                }).join(' ');
            };

            const getSystemPolygonPoints = (system) => {
                return DIMENSIONS.map((dim, i) => {
                    const point = getPoint(i, system.scores[dim.key]);
                    return `${point.x},${point.y}`;
                }).join(' ');
            };

            if (selectedSystems.length === 0) {
                return (
                    <div style={{
                        width: '100%',
                        display: 'flex',
                        flexDirection: 'column',
                        alignItems: 'center',
                        padding: '40px 20px'
                    }}>
                        <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ overflow: 'visible' }}>
                            {/* Grid */}
                            {gridLevels.map(level => (
                                <polygon
                                    key={level}
                                    points={getPolygonPoints(level)}
                                    fill="none"
                                    stroke={theme.gridLine}
                                    strokeWidth="1"
                                    opacity={0.3}
                                />
                            ))}

                            {/* Axes */}
                            {DIMENSIONS.map((dim, i) => {
                                const end = getPoint(i, 5);
                                return (
                                    <line
                                        key={dim.key}
                                        x1={center}
                                        y1={center}
                                        x2={end.x}
                                        y2={end.y}
                                        stroke={theme.gridLine}
                                        strokeWidth="1"
                                        opacity={0.3}
                                    />
                                );
                            })}

                            {/* Labels */}
                            {DIMENSIONS.map((dim, i) => {
                                const labelPoint = getPoint(i, 5.5);
                                const angle = angleStep * i - Math.PI / 2;
                                let textAnchor = 'middle';
                                if (Math.cos(angle) > 0.1) textAnchor = 'start';
                                if (Math.cos(angle) < -0.1) textAnchor = 'end';

                                return (
                                    <text
                                        key={dim.key}
                                        x={labelPoint.x}
                                        y={labelPoint.y}
                                        textAnchor={textAnchor}
                                        fontSize={isMobile ? 11 : 13}
                                        fill={theme.text}
                                        dominantBaseline="middle"
                                    >
                                        {dim.icon} {dim.label}
                                    </text>
                                );
                            })}
                        </svg>
                    </div>
                );
            }

            return (
                <div style={{ width: '100%', display: 'flex', justifyContent: 'center', padding: '20px 0' }}>
                    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{ overflow: 'visible' }}>
                        {/* Grid */}
                        {gridLevels.map(level => (
                            <polygon
                                key={level}
                                points={getPolygonPoints(level)}
                                fill="none"
                                stroke={theme.gridLine}
                                strokeWidth="1"
                                opacity={0.3}
                            />
                        ))}

                        {/* Axes */}
                        {DIMENSIONS.map((dim, i) => {
                            const end = getPoint(i, 5);
                            return (
                                <line
                                    key={dim.key}
                                    x1={center}
                                    y1={center}
                                    x2={end.x}
                                    y2={end.y}
                                    stroke={theme.gridLine}
                                    strokeWidth="1"
                                    opacity={0.3}
                                />
                            );
                        })}

                        {/* System polygons */}
                        {selectedSystems.map(system => (
                            <polygon
                                key={system.id}
                                points={getSystemPolygonPoints(system)}
                                fill={system.color}
                                fillOpacity={theme === THEMES.dark ? 0.2 : 0.15}
                                stroke={system.color}
                                strokeWidth={theme === THEMES.dark ? 2.5 : 2}
                                strokeOpacity={0.8}
                            />
                        ))}

                        {/* Labels */}
                        {DIMENSIONS.map((dim, i) => {
                            const labelPoint = getPoint(i, 5.8);
                            const angle = angleStep * i - Math.PI / 2;
                            let textAnchor = 'middle';
                            if (Math.cos(angle) > 0.1) textAnchor = 'start';
                            if (Math.cos(angle) < -0.1) textAnchor = 'end';

                            return (
                                <text
                                    key={dim.key}
                                    x={labelPoint.x}
                                    y={labelPoint.y}
                                    textAnchor={textAnchor}
                                    fontSize={isMobile ? 11 : 13}
                                    fill={theme.text}
                                    dominantBaseline="middle"
                                    fontWeight="500"
                                >
                                    {dim.icon} {dim.label}
                                </text>
                            );
                        })}
                    </svg>
                </div>
            );
        };

        // ========== SYSTEM SELECTOR COMPONENT ==========

        const SystemSelector = ({ selectedIds, onToggle, onClearAll, theme, isMobile }) => {
            return (
                <div style={{ marginBottom: 30 }}>
                    <div style={{
                        display: 'flex',
                        flexWrap: isMobile ? 'nowrap' : 'wrap',
                        gap: 8,
                        overflowX: isMobile ? 'auto' : 'visible',
                        WebkitOverflowScrolling: 'touch',
                        paddingBottom: isMobile ? 8 : 0
                    }}>
                        {SYSTEMS.map(system => {
                            const isSelected = selectedIds.includes(system.id);
                            return (
                                <button
                                    key={system.id}
                                    onClick={() => onToggle(system.id)}
                                    style={{
                                        padding: isMobile ? '8px 14px' : '10px 18px',
                                        borderRadius: 16,
                                        border: 'none',
                                        backgroundColor: isSelected ? system.color : theme.bgSecondary,
                                        color: isSelected ? '#ffffff' : theme.text,
                                        fontSize: isMobile ? 13 : 14,
                                        fontWeight: isSelected ? '600' : '500',
                                        cursor: 'pointer',
                                        transition: 'all 0.3s ease',
                                        whiteSpace: 'nowrap',
                                        flexShrink: 0,
                                        opacity: 1,
                                        boxShadow: isSelected ? `0 2px 8px ${system.color}40` : 'none'
                                    }}
                                    onMouseEnter={e => !isMobile && (e.target.style.transform = 'translateY(-2px)')}
                                    onMouseLeave={e => !isMobile && (e.target.style.transform = 'translateY(0)')}
                                >
                                    {system.icon} {system.name}
                                </button>
                            );
                        })}
                        <button
                            onClick={onClearAll}
                            disabled={selectedIds.length === 0}
                            style={{
                                padding: isMobile ? '8px 14px' : '10px 18px',
                                borderRadius: 16,
                                border: `1px solid ${theme.border}`,
                                backgroundColor: theme.bg,
                                color: theme.textSecondary,
                                fontSize: isMobile ? 13 : 14,
                                fontWeight: '500',
                                cursor: selectedIds.length > 0 ? 'pointer' : 'not-allowed',
                                whiteSpace: 'nowrap',
                                flexShrink: 0,
                                opacity: selectedIds.length > 0 ? 1 : 0.3,
                                transition: 'opacity 0.3s ease'
                            }}
                        >
                            Clear All {selectedIds.length > 0 ? `(${selectedIds.length})` : ''}
                        </button>
                    </div>
                </div>
            );
        };

        // ========== PATTERNS PANEL COMPONENT ==========

        const PatternsPanel = ({ selectedSystems, theme, isMobile }) => {
            const [expandedCards, setExpandedCards] = useState(isMobile ? [] : selectedSystems.length > 0 ? [selectedSystems[0].id] : []);

            useEffect(() => {
                if (!isMobile && selectedSystems.length > 0 && expandedCards.length === 0) {
                    setExpandedCards([selectedSystems[0].id]);
                }
            }, [selectedSystems, isMobile]);

            if (selectedSystems.length === 0) {
                return null;
            }

            const toggleCard = (systemId) => {
                setExpandedCards(prev =>
                    prev.includes(systemId)
                        ? prev.filter(id => id !== systemId)
                        : [...prev, systemId]
                );
            };

            const getBadgeColor = (score) => {
                if (score >= 4) return { bg: theme.badgeGreenBg, text: theme.badgeGreen };
                if (score >= 3) return { bg: theme.badgeYellowBg, text: theme.badgeYellow };
                return { bg: theme.badgeBlueBg, text: theme.badgeBlue };
            };

            return (
                <div style={{
                    marginTop: 40,
                    display: 'grid',
                    gridTemplateColumns: isMobile ? '1fr' : selectedSystems.length === 1 ? '1fr' : 'repeat(auto-fit, minmax(400px, 1fr))',
                    gap: 20
                }}>
                    {selectedSystems.map(system => {
                        const isExpanded = expandedCards.includes(system.id);

                        return (
                            <div
                                key={system.id}
                                style={{
                                    backgroundColor: theme.bgCard,
                                    borderRadius: 12,
                                    borderLeft: `4px solid ${system.color}`,
                                    boxShadow: `0 2px 8px ${theme.shadow}`,
                                    overflow: 'hidden'
                                }}
                            >
                                {/* Header */}
                                <div
                                    onClick={() => toggleCard(system.id)}
                                    style={{
                                        padding: isMobile ? 16 : 20,
                                        cursor: 'pointer',
                                        display: 'flex',
                                        justifyContent: 'space-between',
                                        alignItems: 'center',
                                        borderBottom: isExpanded ? `1px solid ${theme.border}` : 'none'
                                    }}
                                >
                                    <div>
                                        <h3 style={{ margin: 0, fontSize: isMobile ? 18 : 20, color: theme.text }}>
                                            {system.icon} {system.name}
                                        </h3>
                                        <p style={{ margin: '4px 0 0 0', fontSize: isMobile ? 12 : 14, color: theme.textSecondary }}>
                                            {system.examples}
                                        </p>
                                    </div>
                                    <span style={{ fontSize: 20, color: theme.textSecondary }}>
                                        {isExpanded ? '−' : '+'}
                                    </span>
                                </div>

                                {/* Body */}
                                {isExpanded && (
                                    <div style={{ padding: isMobile ? 16 : 20 }}>
                                        {system.patterns.map(pattern => {
                                            const dimension = DIMENSIONS.find(d => d.key === pattern.dimension);
                                            const score = system.scores[pattern.dimension];
                                            const badge = getBadgeColor(score);

                                            return (
                                                <div key={pattern.dimension} style={{ marginBottom: 20 }}>
                                                    <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 8 }}>
                                                        <span style={{ fontSize: 16 }}>{dimension.icon}</span>
                                                        <h4 style={{ margin: 0, fontSize: isMobile ? 14 : 15, color: theme.text }}>
                                                            {dimension.label}
                                                        </h4>
                                                        <span style={{
                                                            padding: '2px 8px',
                                                            borderRadius: 12,
                                                            fontSize: 12,
                                                            fontWeight: '600',
                                                            backgroundColor: badge.bg,
                                                            color: badge.text
                                                        }}>
                                                            {score}
                                                        </span>
                                                    </div>
                                                    <p style={{ margin: '0 0 8px 0', fontSize: isMobile ? 13 : 14, color: theme.textSecondary, lineHeight: 1.5 }}>
                                                        {pattern.text}
                                                    </p>
                                                    <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6 }}>
                                                        {pattern.tools.map((tool, idx) => (
                                                            <a
                                                                key={idx}
                                                                href={tool.url}
                                                                target="_blank"
                                                                rel="noopener noreferrer"
                                                                title={tool.rationale}
                                                                style={{
                                                                    padding: '4px 10px',
                                                                    borderRadius: 6,
                                                                    fontSize: isMobile ? 12 : 13,
                                                                    backgroundColor: theme.bgSecondary,
                                                                    color: theme.text,
                                                                    textDecoration: 'none',
                                                                    border: `1px solid ${theme.border}`,
                                                                    transition: 'all 0.2s ease'
                                                                }}
                                                                onMouseEnter={e => {
                                                                    e.target.style.backgroundColor = system.color;
                                                                    e.target.style.color = '#ffffff';
                                                                    e.target.style.borderColor = system.color;
                                                                }}
                                                                onMouseLeave={e => {
                                                                    e.target.style.backgroundColor = theme.bgSecondary;
                                                                    e.target.style.color = theme.text;
                                                                    e.target.style.borderColor = theme.border;
                                                                }}
                                                            >
                                                                {tool.name} ↗
                                                            </a>
                                                        ))}
                                                    </div>
                                                    {isMobile && (
                                                        <p style={{ margin: '6px 0 0 0', fontSize: 11, color: theme.textSecondary, fontStyle: 'italic' }}>
                                                            {pattern.tools[0]?.rationale}
                                                        </p>
                                                    )}
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}
                            </div>
                        );
                    })}
                </div>
            );
        };

        // ========== APP COMPONENT ==========

        const App = () => {
            const [theme, setTheme] = useState(() => {
                if (typeof window !== 'undefined' && window.matchMedia) {
                    return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                }
                return 'light';
            });
            const [selectedSystemIds, setSelectedSystemIds] = useState(['url-shortener']);
            const windowSize = useWindowSize();

            // Listen for system theme changes
            useEffect(() => {
                if (typeof window !== 'undefined' && window.matchMedia) {
                    const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                    const handleChange = (e) => {
                        setTheme(e.matches ? 'dark' : 'light');
                    };

                    // Modern browsers
                    if (mediaQuery.addEventListener) {
                        mediaQuery.addEventListener('change', handleChange);
                        return () => mediaQuery.removeEventListener('change', handleChange);
                    }
                    // Fallback for older browsers
                    else if (mediaQuery.addListener) {
                        mediaQuery.addListener(handleChange);
                        return () => mediaQuery.removeListener(handleChange);
                    }
                }
            }, []);

            const currentTheme = THEMES[theme];
            const isMobile = windowSize.width < BREAKPOINTS.sm;

            const toggleTheme = () => {
                setTheme(prev => prev === 'light' ? 'dark' : 'light');
            };

            const toggleSystem = (systemId) => {
                setSelectedSystemIds(prev =>
                    prev.includes(systemId)
                        ? prev.filter(id => id !== systemId)
                        : [...prev, systemId]
                );
            };

            const clearAll = () => {
                setSelectedSystemIds([]);
            };

            const selectedSystems = SYSTEMS.filter(s => selectedSystemIds.includes(s.id));

            return (
                <div style={{
                    minHeight: '100vh',
                    backgroundColor: currentTheme.bg,
                    color: currentTheme.text
                }}>
                    <div className="container">
                        {/* Header */}
                        <div style={{ textAlign: 'center', marginBottom: 40, position: 'relative' }}>
                            <button
                                onClick={toggleTheme}
                                style={{
                                    position: 'absolute',
                                    top: 0,
                                    right: 0,
                                    padding: 12,
                                    borderRadius: 8,
                                    border: 'none',
                                    backgroundColor: currentTheme.bgSecondary,
                                    fontSize: 20,
                                    cursor: 'pointer',
                                    transition: 'transform 0.2s ease'
                                }}
                                onMouseEnter={e => e.target.style.transform = 'scale(1.1)'}
                                onMouseLeave={e => e.target.style.transform = 'scale(1)'}
                            >
                                {theme === 'light' ? '🌙' : '☀️'}
                            </button>

                            <h1 style={{ fontSize: isMobile ? 28 : 42, margin: '0 0 12px 0', fontWeight: '700' }}>
                                System Design Shapes
                            </h1>
                            <p style={{ fontSize: isMobile ? 14 : 18, color: currentTheme.textSecondary, margin: 0, maxWidth: 700, marginLeft: 'auto', marginRight: 'auto' }}>
                                Compare architecture profiles of 20 common system design interview systems
                            </p>
                        </div>

                        {/* System Selector */}
                        <SystemSelector
                            selectedIds={selectedSystemIds}
                            onToggle={toggleSystem}
                            onClearAll={clearAll}
                            theme={currentTheme}
                            isMobile={isMobile}
                        />

                        {/* Subtitle */}
                        <p style={{
                            marginBottom: 30,
                            color: currentTheme.textSecondary,
                            textAlign: 'center',
                            fontSize: isMobile ? 14 : 16,
                            fontStyle: 'italic'
                        }}>
                            Select systems above to compare their architecture profiles
                        </p>

                        {/* Radar Chart */}
                        <RadarChart
                            selectedSystems={selectedSystems}
                            theme={currentTheme}
                            width={windowSize.width}
                        />

                        {/* Patterns Panel */}
                        <PatternsPanel
                            selectedSystems={selectedSystems}
                            theme={currentTheme}
                            isMobile={isMobile}
                        />

                        {/* Footer */}
                        <div style={{ marginTop: 60, paddingTop: 20, borderTop: `1px solid ${currentTheme.border}`, textAlign: 'center', fontSize: isMobile ? 12 : 14, color: currentTheme.textSecondary }}>
                            <p style={{ margin: '0 0 8px 0' }}>
                                Based on "9 Questions for System Design Interviews" by @rauljuncoV
                            </p>
                            <p style={{ margin: '0 0 8px 0' }}>
                                Scores are approximate and meant for interview preparation, not absolute truth.
                            </p>
                            <p style={{ margin: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 16 }}>
                                <span>Built by @tslava</span>
                                <a
                                    href="https://github.com/tslava"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    title="GitHub Profile"
                                    style={{
                                        color: currentTheme.text,
                                        textDecoration: 'none',
                                        display: 'inline-flex',
                                        alignItems: 'center',
                                        transition: 'opacity 0.2s ease'
                                    }}
                                    onMouseEnter={e => e.currentTarget.style.opacity = '0.7'}
                                    onMouseLeave={e => e.currentTarget.style.opacity = '1'}
